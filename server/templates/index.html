<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Camera Control</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111419;
      --panel: #1b2028;
      --panel-2: #242b35;
      --text: #eef3f8;
      --muted: #9aa7b6;
      --line: #303946;
      --accent: #f5c84c;
      --accent-soft: rgba(245, 200, 76, .12);
      --ok: #4ade80;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(245, 200, 76, .07), transparent 34rem),
        var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: #151922;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .metric {
      padding: 14px;
      min-height: 82px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .value {
      font-size: 28px;
      font-weight: 750;
      margin-top: 8px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 650;
    }
    button.primary { border-color: #6d5f2e; background: #3a321a; color: var(--accent); }
    button.danger { border-color: #67313d; background: #341821; color: #fecdd3; }
    button:hover { border-color: #596575; transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .6; transform: none; }
    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(260px, .8fr);
      gap: 18px;
      margin-bottom: 18px;
    }
    .preview {
      position: relative;
      min-height: 360px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #090c11;
    }
    .preview img {
      display: none;
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: contain;
    }
    .preview-meta {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(9, 12, 17, .78);
      backdrop-filter: blur(10px);
    }
    .empty { color: var(--muted); text-align: center; padding: 28px; }
    .side-panel { padding: 18px; }
    .side-panel h2 { margin: 0 0 16px; font-size: 15px; }
    .device { padding: 12px 0; border-top: 1px solid var(--line); }
    .device:first-of-type { border-top: 0; }
    .device-name { font-weight: 700; }
    .device-detail { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .feedback { min-height: 20px; color: var(--muted); font-size: 13px; }
    .panel { overflow: hidden; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: #171c24;
    }
    img.thumb {
      width: 96px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0c0f14;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 8px;
      background: #2c3440;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .pill.ok { color: var(--ok); }
    .pill.bad { color: var(--bad); }
    .pill.ok::before, .pill.bad::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }
    @media (max-width: 760px) {
      header, main { padding-left: 14px; padding-right: 14px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      table { min-width: 860px; }
      .panel { overflow-x: auto; }
      .dashboard-layout { grid-template-columns: 1fr; }
      .preview { min-height: 260px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Motion Camera Control</h1>
    <span class="pill" id="server-status">Loading</span>
  </header>
  <main>
    <section class="grid">
      <div class="metric"><div class="label">Events</div><div class="value" id="total-events">0</div></div>
      <div class="metric"><div class="label">Triggers</div><div class="value" id="triggers">0</div></div>
      <div class="metric"><div class="label">Ignored</div><div class="value" id="ignored">0</div></div>
      <div class="metric"><div class="label">Images Sent</div><div class="value" id="sent-images">0</div></div>
    </section>

    <section class="dashboard-layout">
      <div class="panel preview">
        <div class="empty" id="preview-empty">No camera image has been uploaded yet.</div>
        <img id="latest-image" alt="Latest ESP32-CAM capture">
        <div class="preview-meta" id="preview-meta" hidden>
          <span id="latest-device">Camera</span>
          <span id="latest-time">Waiting</span>
        </div>
      </div>
      <aside class="panel side-panel">
        <h2>Devices</h2>
        <div id="devices"><div class="empty">Waiting for heartbeat data.</div></div>
      </aside>
    </section>

    <div class="toolbar">
      <div>
        <button class="primary" data-command="arm">Arm</button>
        <button data-command="disarm">Disarm</button>
        <button data-command="capture_now">Capture Now</button>
        <button class="danger" data-command="siren">Siren</button>
      </div>
      <button id="refresh">Refresh</button>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Device</th>
            <th>Mode</th>
            <th>Event</th>
            <th>Image</th>
            <th>AI Result</th>
            <th>Counts</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="events"></tbody>
      </table>
    </section>
  </main>

  <script>
    const fmt = new Intl.DateTimeFormat(undefined, {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit"
    });

    function setText(id, value) {
      document.getElementById(id).textContent = value ?? "0";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setFeedback(message, isError = false) {
      const feedback = document.getElementById("feedback");
      feedback.textContent = message;
      feedback.style.color = isError ? "var(--bad)" : "var(--muted)";
    }

    async function loadStatus() {
      const res = await fetch("/api/security/status");
      const data = await res.json();
      setText("total-events", data.stats.total_events);
      setText("triggers", data.stats.triggers);
      setText("ignored", data.stats.ignored);
      setText("sent-images", data.stats.sent_images);
      const status = document.getElementById("server-status");
      status.textContent = data.devices.length ? `${data.devices.length} device online/recent` : "No device heartbeat";
      status.className = `pill ${data.devices.length ? "ok" : "bad"}`;
      const devices = document.getElementById("devices");
      devices.innerHTML = data.devices.length ? data.devices.map(device => `
        <div class="device">
          <div class="device-name">${escapeHtml(device.device_id)}</div>
          <div class="device-detail">${escapeHtml(device.mode || "unknown mode")} · RSSI ${device.rssi ?? "—"} · ${fmt.format(new Date(device.updated_ms))}</div>
        </div>
      `).join("") : '<div class="empty">No heartbeat received yet. Image uploads can still be working.</div>';
    }

    async function loadEvents() {
      const res = await fetch("/api/security/events?limit=50");
      const events = await res.json();
      const tbody = document.getElementById("events");
      const latest = events.find(event => event.image_url);
      const image = document.getElementById("latest-image");
      const previewEmpty = document.getElementById("preview-empty");
      const previewMeta = document.getElementById("preview-meta");
      if (latest) {
        image.src = latest.image_url;
        image.style.display = "block";
        previewEmpty.hidden = true;
        previewMeta.hidden = false;
        setText("latest-device", latest.device_id);
        setText("latest-time", fmt.format(new Date(latest.created_ms)));
      } else {
        image.removeAttribute("src");
        image.style.display = "none";
        previewEmpty.hidden = false;
        previewMeta.hidden = true;
      }
      tbody.innerHTML = events.length ? events.map(event => {
        const ai = event.classification
          ? `${escapeHtml(event.classification)}${event.confidence ? ` ${(event.confidence * 100).toFixed(1)}%` : ""}`
          : "none";
        return `
          <tr>
            <td>${fmt.format(new Date(event.created_ms))}</td>
            <td>${escapeHtml(event.device_id)}</td>
            <td><span class="pill">${escapeHtml(event.mode || "unknown")}</span></td>
            <td>${escapeHtml(event.event_type)}</td>
            <td>${event.image_url ? `<img class="thumb" src="${event.image_url}" alt="capture">` : ""}</td>
            <td>${ai}</td>
            <td>${event.trigger_count || 0} / ${event.ignored_count || 0} / ${event.sent_image_count || 0}</td>
            <td>${event.acknowledged ? `<span class="pill ok">Acked</span>` : `<button data-ack="${event.id}">Ack</button>`}</td>
          </tr>
        `;
      }).join("") : '<tr><td colspan="8" class="empty">No events yet. Trigger the PIR to create the first capture.</td></tr>';
    }

    async function refresh() {
      try {
        await Promise.all([loadStatus(), loadEvents()]);
        setFeedback(`Updated ${new Date().toLocaleTimeString()}`);
      } catch (error) {
        document.getElementById("server-status").textContent = "Server error";
        document.getElementById("server-status").className = "pill bad";
        setFeedback("Could not load dashboard data. Check that Flask is running.", true);
      }
    }

    document.addEventListener("click", async (event) => {
      const command = event.target.dataset.command;
      const ack = event.target.dataset.ack;
      if (command) {
        event.target.disabled = true;
        try {
          const response = await fetch("/api/security/commands", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({device_id: "stick-s3-01", command})
          });
          if (!response.ok) throw new Error("command rejected");
          setFeedback(`Queued “${command}” for StickS3.`);
        } catch (error) {
          setFeedback("Could not queue command.", true);
        } finally {
          event.target.disabled = false;
        }
      }
      if (ack) {
        await fetch(`/api/security/events/${ack}/ack`, {method: "POST"});
        await refresh();
      }
    });

    document.getElementById("refresh").addEventListener("click", refresh);
    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
